<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — WOAH COLLECTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/woah.css">
</head>
<body data-page="criar-conta">

  <div id="site-header"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-banner">
        <img src="images/artists/promo-studio.jpg" alt="" data-site-img="cadastro">
        <span class="logo"><span class="logo-word">WOAH</span><span class="logo-sub">COLLECTION</span></span>
      </div>
      <div class="auth-body">
        <h1>Criar conta</h1>
        <p class="auth-sub">Crie sua conta e comece a lançar seus hits.</p>

        <form id="register-form" novalidate>
          <div class="form-msg" role="alert"></div>
          <div class="field">
            <label for="reg-name">Nome</label>
            <input class="input" id="reg-name" name="name" type="text" placeholder="Seu nome" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="reg-email">E-mail</label>
            <input class="input" id="reg-email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="reg-password">Senha</label>
            <div class="input-wrap">
              <input class="input" id="reg-password" name="password" type="password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
              <button type="button" class="toggle-pass" aria-label="Mostrar senha"></button>
            </div>
          </div>
          <div class="field">
            <label for="reg-confirm">Confirmar senha</label>
            <div class="input-wrap">
              <input class="input" id="reg-confirm" name="confirm" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
              <button type="button" class="toggle-pass" aria-label="Mostrar senha"></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block auth-submit">Criar conta</button>
        </form>

        <p class="auth-switch">Já tem uma conta? <a href="login.html" data-keep-next>Entrar</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
