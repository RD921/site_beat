<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato — WOAH COLLECTION</title>
  <meta name="description" content="Fale com a Woah Collection pelo WhatsApp, e-mail ou Instagram." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/woah.css">
</head>
<body data-page="contato">

  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow">Suporte dedicado</span>
        <h1 class="page-title" style="margin-top:12px">Contato</h1>
        <p class="page-sub">Dúvidas sobre beats, licenças ou pagamento? Fale com a gente.</p>

        <div class="contact-grid">
          <div class="contact-list">
            <a class="info-card" data-wa="Olá! Gostaria de falar com a Woah Collection." target="_blank" rel="noopener" href="#">
              <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg></span>
              <div><h3>WhatsApp</h3><p>Resposta rápida em horário comercial.</p></div>
            </a>
            <a class="info-card" href="mailto:rodrigoarrezzimaciel17@gmail.com">
              <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
              <div><h3>E-mail</h3><p>rodrigoarrezzimaciel17@gmail.com</p></div>
            </a>
            <a class="info-card" href="https://www.instagram.com/rodrigo_arrezzi" target="_blank" rel="noopener">
              <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></span>
              <div><h3>Instagram</h3><p>@rodrigo_arrezzi</p></div>
            </a>
          </div>

          <form class="step-card" id="contact-form" novalidate>
            <h3 style="margin-bottom:16px">Envie uma mensagem</h3>
            <div class="form-msg" role="alert"></div>
            <div class="field">
              <label for="c-name">Nome</label>
              <input class="input" id="c-name" name="name" type="text" placeholder="Seu nome" autocomplete="name">
            </div>
            <div class="field">
              <label for="c-subject">Assunto</label>
              <input class="input" id="c-subject" name="subject" type="text" placeholder="Ex: licença exclusiva">
            </div>
            <div class="field">
              <label for="c-message">Mensagem</label>
              <textarea class="input" id="c-message" name="message" placeholder="Como podemos ajudar?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px">Enviar pelo WhatsApp</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
